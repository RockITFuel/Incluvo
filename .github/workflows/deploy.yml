name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - run: bun run check-types
      - run: bun run lint

  test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml / production (pgvector on PG 18).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: incluvo
          POSTGRES_PASSWORD: incluvo
          POSTGRES_DB: incluvo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incluvo -d incluvo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # test/preload.ts derives and recreates `incluvo_test` from this.
      TEST_DATABASE_URL: postgres://incluvo:incluvo@localhost:5432/incluvo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - run: bun run test

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: incluvo
          POSTGRES_PASSWORD: incluvo
          POSTGRES_DB: incluvo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incluvo -d incluvo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://incluvo:incluvo@localhost:5432/incluvo
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
      # `vite preview` binds to 127.0.0.1 (vite.config.ts), so the app's origin
      # is 127.0.0.1 everywhere.
      BETTER_AUTH_URL: http://127.0.0.1:3200
      CORS_ORIGINS: http://127.0.0.1:3200
      PORT: 3210
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      # A production build: a cold dev server compiles on the first request,
      # which is slow and not what users get.
      - run: bunx vite build
        working-directory: apps/web
      # Same migrations, audit trigger and demo seed as the server tests.
      - run: bun run setup-db
        working-directory: apps/server
      - name: Start server and web app
        run: |
          (cd apps/server && bun src/index.ts > /tmp/server.log 2>&1 &)
          (cd apps/web && ORPC_SERVER_URL=http://localhost:3210 bunx vite preview --port 3200 --strictPort > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3200/login > /dev/null && curl -sf http://localhost:3210/api/health > /dev/null && exit 0
            sleep 2
          done
          echo "app did not start"; exit 1
      - run: bun run test:a11y
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:3200
      - if: failure()
        run: tail -n 50 /tmp/server.log /tmp/web.log

  build-and-push:
    name: Build & Push (${{ matrix.app.name }})
    needs: [check, test, a11y]
    # Pull requests only run the checks; images are built and deployed from main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: server
            dockerfile: apps/server/Dockerfile
            image: youriheuvel/incluvo-server
          - name: web
            dockerfile: apps/web/Dockerfile
            image: youriheuvel/incluvo-web
    steps:
      - uses: actions/checkout@v4

      # Log in to Docker Hub BEFORE booting buildx so the buildkit image is
      # pulled authenticated (anonymous pulls hit Docker Hub rate limits and
      # time out on shared runner IPs).
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ matrix.app.image }}:latest
            ${{ matrix.app.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

      - name: Deploy to Dokploy
        if: ${{ env.DOKPLOY_URL != '' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID_SERVER: ${{ secrets.DOKPLOY_APP_ID_SERVER }}
          DOKPLOY_APP_ID_WEB: ${{ secrets.DOKPLOY_APP_ID_WEB }}
          APP_NAME: ${{ matrix.app.name }}
          DOCKER_IMAGE: ${{ matrix.app.image }}:latest
        run: |
          if [ "$APP_NAME" = "server" ]; then
            DOKPLOY_APP_ID="$DOKPLOY_APP_ID_SERVER"
          else
            DOKPLOY_APP_ID="$DOKPLOY_APP_ID_WEB"
          fi

          curl -sf -X POST "$DOKPLOY_URL/api/application.saveDockerProvider" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\": \"$DOKPLOY_APP_ID\", \"dockerImage\": \"$DOCKER_IMAGE\"}"

          curl -sf -X POST "$DOKPLOY_URL/api/application.redeploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\": \"$DOKPLOY_APP_ID\"}"

          echo "Deployed $DOCKER_IMAGE to Dokploy"
